[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"          # forced: v4-core PoolManager.sol pins =0.8.26
evm_version = "cancun"          # Uniswap v4 needs transient storage
optimizer = true
# Must match v4-core's own setting. At 800 the via-IR pipeline hits
# "Variable memPtr_1 is 1 too deep in the stack" compiling v4-core Pool.sol —
# the inlining decisions at very high runs are what keep that function within
# stack limits. This is not a tuning knob while v4-core is a dependency.
optimizer_runs = 44444444
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments.json" }]
ffi = false

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@uniswap/v4-core/=lib/v4-core/",
  "v4-core/=lib/v4-core/src/",
  "solmate/=lib/v4-core/lib/solmate/",
]

[profile.ci]
verbosity = 3
fuzz = { runs = 1000 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"

[rpc_endpoints]
hedera_testnet = "${HEDERA_RPC_URL}"
anvil = "http://127.0.0.1:8545"

[etherscan]
# HashScan / Sourcify verification is configured at deploy time; no API key.
